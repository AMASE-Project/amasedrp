name: amase
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - astropy
  - numpy
  - scipy
  - matplotlib
  - astroscrappy
  - joblib
  - numba
  - pytest
  - pip
  - pip:
    # Both repositories cloned side by side, and run `conda env create -f
    # environment.yml` from this repository's root: the path is relative.
    - -e ../amasecore
    - -e .
